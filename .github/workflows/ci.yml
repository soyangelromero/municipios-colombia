name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e "pipeline[dev]"

      - name: Lint y formato
        run: |
          ruff check pipeline
          ruff format --check pipeline

      - name: Pruebas
        run: pytest pipeline

  web:
    name: Web (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Revisar sintaxis PHP
        run: |
          archivos=$(find web -name '*.php' 2>/dev/null || true)
          if [ -z "$archivos" ]; then echo "Sin archivos PHP todavía."; exit 0; fi
          for f in $archivos; do php -l "$f"; done

  secretos:
    name: Buscar secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
