# Registro de fuentes. Cada observación del pipeline apunta a una de estas claves.
# Campos: organismo, titulo, url, conjunto (id en datos.gov.co, si aplica), licencia, oficial.
# Antes de agregar una fuente, revisa sus términos de uso y anótalos en «licencia».

[dane_divipola]
organismo = "Departamento Administrativo Nacional de Estadística (DANE)"
titulo = "DIVIPOLA – Códigos municipios"
url = "https://www.datos.gov.co/d/gdxc-w37w"
conjunto = "gdxc-w37w"
licencia = "Por verificar en la ficha del conjunto (datos.gov.co)"
oficial = true

