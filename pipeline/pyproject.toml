[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "municipios-colombia"
version = "0.1.0"
description = "Pipeline de datos del observatorio Municipios Colombia"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "scrapling[fetchers]>=0.4.15,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
municipios = "municipios.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["municipios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
