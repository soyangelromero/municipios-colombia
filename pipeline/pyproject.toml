[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "municipios-colombia"
version = "0.1.0"
description = "Pipeline de datos del observatorio Municipios Colombia"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",
    "scrapling[fetchers]>=0.4.15,<0.5",
]

[project.urls]
Repositorio = "https://github.com/soyangelromero/municipios-colombia"
Issues = "https://github.com/soyangelromero/municipios-colombia/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
municipios = "municipios.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["municipios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# GML de ejemplo copiado del servicio real: sus líneas son largas a propósito.
"tests/test_mgn.py" = ["E501"]
# Plantillas HTML: partir el marcado en líneas cortas lo vuelve más difícil de leer.
"municipios/exportar/paginas.py" = ["E501"]
"municipios/exportar/plantillas.py" = ["E501"]
